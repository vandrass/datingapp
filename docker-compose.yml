services:
  db:
    image: postgres:17
    container_name: datingapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ivan
      POSTGRES_PASSWORD: dating_dev_password
      POSTGRES_DB: datingapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: